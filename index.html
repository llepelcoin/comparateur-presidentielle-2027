  { id: "p27", candidateId: "roussel", themeId: "finances",
    text: "Recruter 500 000 agents publics supplémentaires en cinq ans (« 500 000 agents publics qu'il manque à notre pays ») et hausse immédiate de 10 % du point d'indice des fonctionnaires, financée par une « grande chasse à l'évasion fiscale ».",
    chiffres: [{ valeur: "500 000", contexte: "recrutements publics visés en 5 ans" }, { valeur: "+10%", contexte: "hausse immédiate du point d'indice" }],
    sources: [
      { label: "franceinfo, 12 nov. 2026", url: "https://www.franceinfo.fr/elections/presidentielle/presidentielle-fabien-roussel-propose-la-mise-en-place-de-60-000-policiers-gendarmes-et-douaniers-de-proximite_8279156.html" },
      { label: "Entrevue, 12 nov. 2026", url: "https://entrevue.fr/politique/presidentielle-2027/presidentielle-2027-fabien-roussel-vise-500-000-recrutements-dans-les-services-publics-et-une-hausse-immediate-de-10-des-salaires-des-fonctionnaires/" }
    ] },
  { id: "p28", candidateId: "attal", themeId: "finances",
    text: "Supprimer 100 000 postes dans l'État et les collectivités via un plan inédit de départs volontaires avec indemnité (« je ne propose pas la suppression sèche »), tout en promettant « pas de poste supprimé » dans l'Éducation nationale.",
    chiffres: [{ valeur: "100 000", contexte: "postes visés par départs volontaires" }],
    sources: [
      { label: "Capital/Yahoo Finance, 12 nov. 2026", url: "https://fr.finance.yahoo.com/actualites/indemnit%C3%A9-quitter-fonction-publique-gabriel-220438244.html" },
      { label: "franceinfo, 12 nov. 2026", url: "https://www.franceinfo.fr/elections/presidentielle/presidentielle-le-candidat-renaissance-gabriel-attal-promet-qu-il-n-y-aura-pas-de-poste-supprime-dans-l-education-nationale-s-il-est-elu_8278985.html" }
    ] },
  { id: "p29", candidateId: "tondelier", themeId: "ecologie",
    text: "Taxer à 20 % les 1 % des héritages les plus élevés : « c'est avec ça qu'on finance ce grand plan de transition » écologique.",
    chiffres: [{ valeur: "20%", contexte: "taxe sur les 1 % des héritages les plus élevés" }],
    sources: [
      { label: "franceinfo, 12 nov. 2026", url: "https://www.franceinfo.fr/elections/presidentielle/direct-presidentielle-2027-education-sante-transports-suivez-les-interviews-de-huit-candidats-dans-le-cadre-de-l-operation-nos-services-publics_8276135.html" }
    ] },
  { id: "p30", candidateId: "glucksmann", themeId: "education",
    text: "Augmenter les salaires des enseignants : jusqu'à +25 % « en milieu de carrière » et +10 % pour l'ensemble des enseignants ; moratoire sur les fermetures d'écoles en milieu rural décidées sans concertation et réaffirmation de la mixité sociale à l'école publique.",
    chiffres: [{ valeur: "+25%", contexte: "hausses de salaire en milieu de carrière" }, { valeur: "+10%", contexte: "pour l'ensemble des enseignants" }],
    sources: [
      { label: "franceinfo, 12 nov. 2026", url: "https://www.franceinfo.fr/elections/presidentielle/direct-presidentielle-2027-education-sante-transports-suivez-les-interviews-de-huit-candidats-dans-le-cadre-de-l-operation-nos-services-publics_8276135.html" }
    ] },
  { id: "p31", candidateId: "retailleau", themeId: "institutions",
    text: "Maintient la primaire de la droite et du centre « même sans Édouard Philippe » : « il ne faut pas l'empêcher », refusant « de donner à un individu particulier un droit de veto » ; réunion des directeurs de campagne Attal-Retailleau-Lisnard annoncée le 17 novembre.",
    chiffres: [{ valeur: "17 nov. 2026", contexte: "réunion des directeurs de campagne sur la primaire" }],
    sources: [
      { label: "BFMTV, 12 nov. 2026", url: "https://www.bfmtv.com/politique/elections/presidentielle/presidentielle-2027-bruno-retailleau-souhaite-une-primaire-de-la-droite-et-du-centre-meme-sans-edouard-philippe_AN-202611120639.html" },
      { label: "RTL, 12 nov. 2026", url: "https://www.rtl.fr/actu/politique/il-ne-faut-pas-l-empecher-bruno-retailleau-estime-que-la-primaire-a-droite-et-au-centre-pour-la-presidentielle-2027-doit-se-faire-meme-sans-edouard-philippe-7900695502" }
    ] }
];

var STORAGE_KEY = "pres2027_props_v1";

// ============ ÉTAT ============
var state = { tab: "themes", theme: THEMES[0].id, cand: CANDIDATES[0].id };
var props = (function () {
  try {
    var saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return JSON.parse(saved);
  } catch (e) {}
  return INITIAL_PROPOSITIONS.slice();
})();
function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(props)); } catch (e) {}
}
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function cand(id) { for (var i = 0; i < CANDIDATES.length; i++) if (CANDIDATES[i].id === id) return CANDIDATES[i]; return null; }
function theme(id) { for (var i = 0; i < THEMES.length; i++) if (THEMES[i].id === id) return THEMES[i]; return null; }

// ============ RENDU ============
var app = document.getElementById("app");

function card(p) {
  var c = cand(p.candidateId);
  var src = "";
  var sources = p.sources || (p.source ? [p.source] : []);
  if (sources.length > 0) {
    src = '<div class="src">';
    for (var i = 0; i < sources.length; i++) {
      var s = sources[i];
      src += s.url
        ? '<a href="' + esc(s.url) + '" target="_blank" rel="noreferrer">↗ ' + esc(s.label) + "</a>"
        : '<span style="color:#94a3b8">' + esc(s.label) + "</span>";
      if (i < sources.length - 1) src += ' &nbsp;·&nbsp; ';
    }
    src += "</div>";
  }
  var chf = "";
  var chiffres = p.chiffres || [];
  if (chiffres.length > 0) {
    chf = '<div class="chiffres">';
    for (var i = 0; i < chiffres.length; i++) {
      chf += '<span class="chiffre">📊 <b>' + esc(chiffres[i].valeur) + "</b>" + (chiffres[i].contexte ? " " + esc(chiffres[i].contexte) : "") + "</span>";
    }
    chf += "</div>";
  }
  var del = p.mine ? '<button class="del" title="Supprimer" onclick="removeProp(\'' + p.id + '\')">✕</button>' : "";
  var badge = p.mine ? '<span class="badge">ma note</span>' : "";
  return '<div class="card">' + del +
    '<div class="who"><span class="dot" style="background:' + c.color + '"></span><b>' + esc(c.name) + "</b><span>" + esc(c.party) + "</span>" + badge + "</div>" +
    "<p>" + esc(p.text) + "</p>" + chf + src + "</div>";
}

function render() {
  var html = "<h1>🇫🇷 Comparateur des programmes — Présidentielle 2027</h1>" +
    '<p class="sub">1er tour : 18 avril 2027 · 2nd tour : 2 mai 2027 · Parrainages avant le 12 mars 2027</p>' +
    '<p class="tiny">Outil personnel d\'analyse : qui propose quoi, thème par thème. ' + props.length + " proposition" + (props.length > 1 ? "s" : "") + " enregistrée" + (props.length > 1 ? "s" : "") + " · tes notes sont sauvegardées dans ce navigateur.</p>";

  var tabs = [["themes", "📂 Par thème"], ["candidats", "👤 Par candidat"], ["matrice", "🧮 Vue d'ensemble"], ["ajouter", "➕ Ajouter"]];
  html += '<nav>';
  for (var i = 0; i < tabs.length; i++)
    html += '<button class="tab' + (state.tab === tabs[i][0] ? " active" : "") + '" onclick="setTab(\'' + tabs[i][0] + "')\">" + tabs[i][1] + "</button>";
  html += "</nav>";

  if (state.tab === "themes") {
    html += '<div class="chips">';
    for (var i = 0; i < THEMES.length; i++)
      html += '<button class="chip' + (state.theme === THEMES[i].id ? " active" : "") + '" onclick="setTheme(\'' + THEMES[i].id + "')\">" + THEMES[i].icon + " " + THEMES[i].label + "</button>";
    html += "</div>";
    var t = theme(state.theme);
    html += "<h2>" + t.icon + " " + t.label + " — propositions</h2>";
    var list = props.filter(function (p) { return p.themeId === state.theme; });
    html += '<div class="grid">';
    for (var i = 0; i < list.length; i++) html += card(list[i]);
    html += "</div>";
    if (list.length === 0)
      html += '<div class="empty">Aucune proposition enregistrée sur ce thème.<br>Ajoute-en via l\'onglet « ➕ Ajouter ».</div>';
  }

  if (state.tab === "candidats") {
    html += '<div class="chips">';
    for (var i = 0; i < CANDIDATES.length; i++) {
      var c = CANDIDATES[i];
      html += '<button class="chip' + (state.cand === c.id ? " active" : "") + '" onclick="setCand(\'' + c.id + "')\"><span class=\"dot\" style=\"background:" + c.color + '"></span>' + esc(c.name) + "</button>";
    }
    html += "</div>";
    var c = cand(state.cand);
    html += '<div class="card" style="margin-bottom:16px"><div class="who"><span class="dot" style="background:' + c.color + '"></span><h2 style="margin:0">' + esc(c.name) + "</h2></div><p>" + esc(c.party) + " · " + esc(c.bloc) + "</p></div>";
    var any = false;
    for (var j = 0; j < THEMES.length; j++) {
      var list = props.filter(function (p) { return p.themeId === THEMES[j].id && p.candidateId === state.cand; });
      if (list.length === 0) continue;
      any = true;
      html += '<h3 class="sec">' + THEMES[j].icon + " " + THEMES[j].label + "</h3><div class=\"grid\">";
      for (var i = 0; i < list.length; i++) html += card(list[i]);
      html += "</div>";
    }
    if (!any) html += '<div class="empty">Aucune proposition enregistrée pour ce candidat. Utilise l\'onglet « ➕ Ajouter ».</div>';
  }

  if (state.tab === "matrice") {
    html += "<h2>🧮 Vue d'ensemble de la collecte</h2>" +
      '<p class="sub" style="margin-bottom:14px">Nombre de propositions par candidat et par thème.</p><table><thead><tr><th style="text-align:left">Candidat</th>';
    for (var i = 0; i < THEMES.length; i++) html += "<th class=\"c\" title=\"" + esc(THEMES[i].label) + "\">" + THEMES[i].icon + "</th>";
    html += '<th class="c">Σ</th></tr></thead><tbody>';
    for (var i = 0; i < CANDIDATES.length; i++) {
      var c = CANDIDATES[i], total = 0;
      html += '<tr><td><span class="dot" style="background:' + c.color + '"></span> <b>' + esc(c.name) + "</b></td>";
      for (var j = 0; j < THEMES.length; j++) {
        var n = props.filter(function (p) { return p.candidateId === c.id && p.themeId === THEMES[j].id; }).length;
        total += n;
        html += '<td class="c">' + (n > 0 ? '<span class="num">' + n + "</span>" : '<span class="num zero">·</span>') + "</td>";
      }
      html += '<td class="c"><b>' + total + "</b></td></tr>";
    }
    html += "</tbody></table>";
  }

  if (state.tab === "ajouter") {
    html += "<h2>➕ Ajouter une proposition</h2>" +
      '<div class="note">💾 <b>Sauvegarde automatique</b> : tes notes sont conservées dans ce navigateur, même après fermeture. Utilise « Exporter » pour les transférer vers un autre appareil ou une autre personne (puis « Importer » de l\'autre côté).</div>' +
      '<form onsubmit="return addProp(event)">' +
      '<div class="row2"><label>Candidat<select id="f-cand">';
    for (var i = 0; i < CANDIDATES.length; i++)
      html += '<option value="' + CANDIDATES[i].id + '">' + esc(CANDIDATES[i].name) + " — " + esc(CANDIDATES[i].party) + "</option>";
    html += '</select></label><label>Thème<select id="f-theme">';
    for (var i = 0; i < THEMES.length; i++)
      html += '<option value="' + THEMES[i].id + '">' + THEMES[i].icon + " " + THEMES[i].label + "</option>";
    html += '</select></label></div>' +
      '<label>Proposition / position<textarea id="f-text" rows="3" placeholder="Ex. : Ramener l\'âge légal de départ à la retraite à 62 ans…"></textarea></label>' +
      '<div class="row2"><label>Source 1 (optionnel)<input id="f-srclabel1" placeholder="Ex. : interview BFM, 12 nov. 2026" /></label>' +
      '<label>Lien source 1 (optionnel)<input id="f-srcurl1" placeholder="https://…" /></label></div>' +
      '<div class="row2"><label>Source 2 (optionnel)<input id="f-srclabel2" placeholder="Ex. : programme officiel, p. 12" /></label>' +
      '<label>Lien source 2 (optionnel)<input id="f-srcurl2" placeholder="https://…" /></label></div>' +
      '<div class="row2"><label>Donnée chiffrée (optionnel)<input id="f-chval" placeholder="Ex. : -50 Md€, 57% → 43%…" /></label>' +
      '<label>Contexte du chiffre<input id="f-chctxe" placeholder="Ex. : part des énergies fossiles d\'ici 2035" /></label></div>' +
      '<button class="btn" type="submit">Enregistrer</button>' +
      '<span class="flash" id="flash"></span></form>' +
      '<div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap">' +
      '<button class="btn ghost" onclick="exportJSON()">⬇ Exporter mes notes (JSON)</button>' +
      '<button class="btn ghost" onclick="document.getElementById(\'imp\').click()">⬆ Importer des notes (JSON)</button>' +
      '<input type="file" id="imp" accept=".json,application/json" style="display:none" onchange="importJSON(event)" />' +
      '<button class="btn ghost" onclick="resetProps()">↺ Réinitialiser</button></div>' +
      '<p class="tiny">Export/Import : transfère uniquement les propositions ajoutées manuellement ("ma note").</p>';
  }

  html += '<footer>Candidats déclarés recensés début novembre 2026 — la liste évolue (primaires, désistements possibles). Toujours vérifier les propositions dans les sources originales.</footer>';
  app.innerHTML = html;
}

// ============ ACTIONS ============
window.setTab = function (t) { state.tab = t; render(); };
window.setTheme = function (t) { state.theme = t; state.tab = "themes"; render(); };
window.setCand = function (c) { state.cand = c; state.tab = "candidats"; render(); };
window.removeProp = function (id) { props = props.filter(function (p) { return p.id !== id; }); persist(); render(); };
window.addProp = function (ev) {
  ev.preventDefault();
  var text = document.getElementById("f-text").value.trim();
  var fl = document.getElementById("flash");
  if (!text) { fl.textContent = "⚠️ Écris d'abord une proposition."; return false; }
  var sources = [];
  [["f-srclabel1", "f-srcurl1"], ["f-srclabel2", "f-srcurl2"]].forEach(function (ids) {
    var lbl = document.getElementById(ids[0]).value.trim();
    if (lbl) sources.push({ label: lbl, url: document.getElementById(ids[1]).value.trim() || null });
  });
  var chval = document.getElementById("f-chval").value.trim();
  props.push({
    id: "u" + Date.now(),
    candidateId: document.getElementById("f-cand").value,
    themeId: document.getElementById("f-theme").value,
    text: text,
    sources: sources,
    chiffres: chval ? [{ valeur: chval, contexte: document.getElementById("f-chctxe").value.trim() }] : [],
    mine: true
  });
  persist(); render();
  return false;
};
window.exportJSON = function () {
  var mine = props.filter(function (p) { return p.mine; });
  var blob = new Blob([JSON.stringify({ type: "pres2027-notes", propositions: mine }, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "notes-presidentielle-2027.json";
  a.click();
  URL.revokeObjectURL(a.href);
};
window.importJSON = function (ev) {
  var file = ev.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var data = JSON.parse(reader.result);
      var incoming = data.propositions || data;
      if (!(incoming instanceof Array)) throw new Error("format");
      var existing = {}; props.forEach(function (p) { existing[p.id] = true; });
      var added = 0;
      incoming.forEach(function (p) {
        if (p && p.text && p.candidateId && !existing[p.id]) { p.mine = true; props.push(p); added++; }
      });
      persist(); render();
      alert("Import : " + added + " proposition(s) ajoutée(s).");
    } catch (e) { alert("Fichier invalide."); }
  };
  reader.readAsText(file);
  ev.target.value = "";
};
window.resetProps = function () {
  if (confirm("Réinitialiser toutes les propositions aux données de base ? Tes notes personnelles seront supprimées.")) {
    props = INITIAL_PROPOSITIONS.slice();
    persist(); render();
  }
};

render();
</script>
</body>
</html>
